name: Ki-Core Candidate Build

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full product/main commit SHA to build
        required: true
        type: string
      platform:
        description: Canonical platform to build
        required: true
        type: choice
        options:
          - all
          - macos-x64
          - macos-arm64
          - linux-x64
          - linux-arm64
          - windows-x64
          - windows-arm64
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  CROSS_GIT_REV: "29d00c7803f221f1b3f35e561b03792368fb8339"
  LINUX_X64_GLIBC_MAX: "GLIBC_2.34"
  LINUX_ARM64_GLIBC_MAX: "GLIBC_2.30"

jobs:
  prepare:
    name: Validate Candidate Source
    if: vars.KI_ENABLE_RELEASE_AUTOMATION == 'true' && github.ref == 'refs/heads/product/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate frozen product commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$WORKFLOW_SHA" || "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]]; then
            echo "Candidate workflow ref does not match expected_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin product/main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$WORKFLOW_SHA" ]]; then
            echo "Candidate commit is not the current product/main head" >&2
            exit 1
          fi

          KI_CORE_VERIFY_REMOTE_TAG=1 scripts/ki-core-release/validate-release-metadata.sh

      - name: Generate canonical platform matrix
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          MACOS_X64='{"platform":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin","binary_name":"aioncore","use_cross":false}'
          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin","binary_name":"aioncore","use_cross":false}'
          LINUX_X64='{"platform":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","binary_name":"aioncore","use_cross":false}'
          LINUX_ARM64='{"platform":"linux-arm64","os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","binary_name":"aioncore","use_cross":true}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","binary_name":"aioncore.exe","rustflags":"-C target-feature=+crt-static","use_cross":false}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-latest","target":"aarch64-pc-windows-msvc","binary_name":"aioncore.exe","rustflags":"-C target-feature=+crt-static","use_cross":false}'

          case "$PLATFORM" in
            all)
              value="{\"include\":[$MACOS_X64,$MACOS_ARM64,$LINUX_X64,$LINUX_ARM64,$WINDOWS_X64,$WINDOWS_ARM64]}"
              ;;
            macos-x64) value="{\"include\":[$MACOS_X64]}" ;;
            macos-arm64) value="{\"include\":[$MACOS_ARM64]}" ;;
            linux-x64) value="{\"include\":[$LINUX_X64]}" ;;
            linux-arm64) value="{\"include\":[$LINUX_ARM64]}" ;;
            windows-x64) value="{\"include\":[$WINDOWS_X64]}" ;;
            windows-arm64) value="{\"include\":[$WINDOWS_ARM64]}" ;;
            *)
              echo "Unsupported platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

          echo "value=$value" >> "$GITHUB_OUTPUT"
          jq . <<< "$value"

  build:
    name: Build Candidate ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Fix MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ki-core-candidate-${{ matrix.target }}-${{ matrix.os }}${{ matrix.target == 'x86_64-unknown-linux-gnu' && format('-glibc-{0}', env.LINUX_X64_GLIBC_MAX) || '' }}${{ matrix.use_cross == true && format('-cross-{0}-glibc-{1}', env.CROSS_GIT_REV, env.LINUX_ARM64_GLIBC_MAX) || '' }}

      - name: Verify pinned Linux ARM64 cross image
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: docker pull ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:99e041b94e7d4f31477c6ddede176688562c3762ba3833b75de3316100afc39d

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --rev "${CROSS_GIT_REV}" --locked

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" -p aionui-app
          else
            cargo build --release --target "${{ matrix.target }}" -p aionui-app
          fi

      - name: Verify Linux ARM64 GLIBC baseline
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_ARM64_GLIBC_MAX}"

      - name: Verify Linux x64 GLIBC baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_X64_GLIBC_MAX}"

      - name: Package candidate archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < ki-core-version.txt)"
          archive="ki-core-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/$archive" "${{ matrix.binary_name }}"

      - name: Package candidate archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content ki-core-version.txt -Raw).Trim()
          $archive = "ki-core-v${version}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}"

      - name: Build and verify candidate provenance
        shell: bash
        env:
          KI_CORE_REPOSITORY: ${{ github.repository }}
          KI_CORE_WORKFLOW: build-manual.yml
          KI_CORE_RUN_ID: ${{ github.run_id }}
          KI_CORE_HEAD_SHA: ${{ github.sha }}
        run: |
          scripts/ki-core-release/build-release-manifest.sh candidate dist
          scripts/ki-core-release/verify-release-assets.sh candidate dist

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ki-core-candidate-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Candidate Summary
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write candidate identity
        run: |
          echo "## Ki-Core Candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: \`build-manual.yml\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Head SHA: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform selection: \`${{ inputs.platform }}\`" >> "$GITHUB_STEP_SUMMARY"
