name: CI

on:
  push:
    branches: [product/main]
  pull_request:
    branches: [product/main]
  workflow_dispatch:
    inputs:
      force_workspace_test:
        description: Run the full Rust workspace test when runtime files are unchanged
        required: true
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  migration-immutability:
    name: Migration Immutability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bash scripts/migration/check-immutability.test.sh
      - run: bash scripts/migration/check-immutability.sh
      - run: bash scripts/ki-core-release/validate-release-metadata.test.sh
      - run: KI_CORE_VERIFY_REMOTE_TAG=1 bash scripts/ki-core-release/validate-release-metadata.sh
      - run: bash scripts/ki-core-release/validate-release-please.test.sh
      - run: bash scripts/ki-core-release/validate-release-workflows.test.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workspace == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_workspace_test)
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace

  changes:
    name: Detect CI test changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            workspace:
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/*/Cargo.toml'
      - name: Summarize workspace test decision
        if: always()
        env:
          WORKSPACE_CHANGED: ${{ steps.filter.outputs.workspace }}
          WORKSPACE_FILES: ${{ steps.filter.outputs.workspace_files }}
          FORCE_WORKSPACE_TEST: ${{ inputs.force_workspace_test }}
        run: |
          {
            echo "### Workspace test decision"
            echo ""
            echo "- Runtime-impact files changed: \`${WORKSPACE_CHANGED:-false}\`"
            echo "- Manual force input: \`${FORCE_WORKSPACE_TEST:-false}\`"
            echo "- Matched files: \`${WORKSPACE_FILES:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-audit --locked
      - run: cargo audit
