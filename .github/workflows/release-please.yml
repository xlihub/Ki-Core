name: Release Please

on:
  push:
    branches: [product/main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release Please operation
        required: true
        type: choice
        options:
          - update-pr
          - release-current
        default: update-pr

permissions: read-all

concurrency:
  group: release-please-product-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Ki-Core Release
    if: >-
      vars.KI_ENABLE_RELEASE_AUTOMATION == 'true' &&
      github.ref == 'refs/heads/product/main' &&
      ((github.event_name == 'push' &&
        (contains(github.event.head_commit.message, 'chore: release') ||
         contains(github.event.head_commit.message, 'chore(product/main): release'))) ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-current'))
    runs-on: ubuntu-latest
    environment: ki-core-stable
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: product/main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Trigger stable build workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "Release created: ${RELEASE_TAG}"
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --field "tag_name=${RELEASE_TAG}"

      - name: Explain unchanged release state
        if: steps.release.outputs.release_created != 'true'
        run: |
          echo "No release was created. The current manifest version may already have a tag."

  update-pr:
    name: Update Ki-Core Release PR
    if: >-
      vars.KI_ENABLE_RELEASE_AUTOMATION == 'true' &&
      github.ref == 'refs/heads/product/main' &&
      ((github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore: release') &&
        !contains(github.event.head_commit.message, 'chore(product/main): release')) ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'update-pr'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: product/main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Checkout release PR branch
        if: steps.release-please.outputs.pr
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Ki-Core release metadata
        if: steps.release-please.outputs.pr
        run: |
          if [[ -f ki-core-upstream-pending.json ]]; then
            mv ki-core-upstream-pending.json ki-core-upstream.json
          fi
          version="$(tr -d '[:space:]' < ki-core-version.txt)"
          upstream_tag="$(jq -er '.tag' ki-core-upstream.json)"
          upstream_commit="$(jq -er '.peeledCommit' ki-core-upstream.json)"
          KI_CORE_VERIFY_REMOTE_TAG=1 scripts/ki-core-release/update-release-map.sh \
            "$version" \
            "$upstream_tag" \
            "$upstream_commit"
          KI_CORE_VERIFY_REMOTE_TAG=1 scripts/ki-core-release/validate-release-metadata.sh

      - name: Commit release metadata if changed
        if: steps.release-please.outputs.pr
        run: |
          if git diff --quiet -- ki-core-upstream.json ki-core-upstream-pending.json ki-core-versions.json; then
            echo "Ki-Core release metadata is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            scripts/ki-core-release/stage-release-metadata.sh
            git commit -m "chore(release): update Ki-Core release metadata"
            git push
          fi

      - name: Run metadata-only CI for the final PR head
        if: steps.release-please.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
        run: |
          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_BRANCH}" \
            --field force_workspace_test=false
