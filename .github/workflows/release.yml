name: Ki-Core Stable Release

on:
  push:
    tags:
      - "ki-core-v*"
  workflow_call:
    inputs:
      tag_name:
        description: Ki-Core tag to build and publish, for example ki-core-v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Ki-Core tag to build and publish, for example ki-core-v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  CROSS_GIT_REV: "29d00c7803f221f1b3f35e561b03792368fb8339"
  LINUX_X64_GLIBC_MAX: "GLIBC_2.34"
  LINUX_ARM64_GLIBC_MAX: "GLIBC_2.30"
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate release tag and mapping
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^ki-core-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use ki-core-vX.Y.Z" >&2
            exit 1
          fi
          version="${RELEASE_TAG#ki-core-v}"
          if [[ "$(tr -d '[:space:]' < ki-core-version.txt)" != "$version" ]]; then
            echo "Release tag does not match ki-core-version.txt" >&2
            exit 1
          fi
          KI_CORE_VERIFY_REMOTE_TAG=1 scripts/ki-core-release/validate-release-metadata.sh
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: aioncore
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: aioncore
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: aioncore
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: aioncore
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: aioncore.exe
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: aioncore.exe
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Fix MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ki-core-release-${{ matrix.target }}-${{ matrix.os }}${{ matrix.target == 'x86_64-unknown-linux-gnu' && format('-glibc-{0}', env.LINUX_X64_GLIBC_MAX) || '' }}${{ matrix.use_cross == true && format('-cross-{0}-glibc-{1}', env.CROSS_GIT_REV, env.LINUX_ARM64_GLIBC_MAX) || '' }}

      - name: Verify pinned Linux ARM64 cross image
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: docker pull ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:99e041b94e7d4f31477c6ddede176688562c3762ba3833b75de3316100afc39d

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --rev "${CROSS_GIT_REV}" --locked

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" -p aionui-app
          else
            cargo build --release --target "${{ matrix.target }}" -p aionui-app
          fi

      - name: Verify Linux ARM64 GLIBC baseline
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_ARM64_GLIBC_MAX}"

      - name: Verify Linux x64 GLIBC baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_X64_GLIBC_MAX}"

      - name: Package binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          archive="ki-core-v${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${archive}" "${{ matrix.binary_name }}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Package binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $archive = "ki-core-v${env:VERSION}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release Assets
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum ki-core-* > ki-core-checksums.txt

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
